name: ci
on:
  push:
    branches-ignore: [main]   # main is tested by deploy.yml, which calls this workflow for the services that changed
  pull_request:
  workflow_call:
    inputs:                   # strings, so that a normal push or pull request (no inputs) runs everything
      run_backend:  { type: string, default: "true" }
      run_frontend: { type: string, default: "true" }

jobs:
  frontend:
    if: ${{ inputs.run_frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  backend:
    if: ${{ inputs.run_backend != 'false' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - name: Throwaway secrets for CI (generated here, never stored)
        run: |
          cp ../.env.example ../.env
          .venv/bin/python -m scripts.dev_env
      - run: docker compose -f ../docker-compose.yml --project-directory .. up -d --wait postgres
      - name: Backend suites
        run: |
          set -a; . ../.env; set +a
          PG_SUPERUSER_URL="postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@127.0.0.1" \
          OWNER_PASSWORD="$SENTRAIL_OWNER_PASSWORD" sh tests/run_all.sh

  image-backend:   # the production images must at least build on every change
    if: ${{ inputs.run_backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha,scope=api, cache-to: "type=gha,scope=api,mode=max" }

  image-frontend:
    if: ${{ inputs.run_frontend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: false, cache-from: type=gha,scope=web, cache-to: "type=gha,scope=web,mode=max" }
