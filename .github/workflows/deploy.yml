name: deploy
# Backend and frontend are separate images with separate versions (the commit SHA they were built from).
#   push to main  -> test, build and deploy only the service(s) whose folder changed
#   Run workflow  -> pick service (backend | frontend | both) and action:
#                      deploy         build this commit and deploy it
#                      rollback       version empty = the previous version of that service; or a commit SHA from list-versions
#                      list-versions  show the images in ECR (newest first); deploys nothing
# No SSH and no AWS keys in GitHub: an OIDC role pushes to ECR and Systems Manager runs scripts/deploy.sh on the host.
# Setup: docs/DEPLOYMENT_AWS.md
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Which service"
        type: choice
        options: [both, backend, frontend]
        default: both
      action:
        description: "deploy = build this commit and deploy it | rollback = go back | list-versions = show what can be rolled back to"
        type: choice
        options: [deploy, rollback, list-versions]
        default: deploy
      version:
        description: "Rollback only: commit SHA to go back to. Empty = the previous version of the chosen service(s)."
        type: string
        required: false
        default: ""
      seed_demo:
        description: "Seed demo data after deploy (needs ENV=dev in the secret; sandbox only)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      action:   ${{ steps.p.outputs.action }}
      backend:  ${{ steps.p.outputs.backend }}
      frontend: ${{ steps.p.outputs.frontend }}
      run:      ${{ steps.p.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          IN_SERVICE: ${{ inputs.service }}
          IN_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          # Deploy scripts come from the branch being run, so only main may deploy.
          [ "$REF" = refs/heads/main ] || { echo "::error::Run this workflow from the main branch"; exit 1; }
          backend=false; frontend=false; run=true; action=deploy
          if [ "$EVENT" = push ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); else changed=$(git ls-files); fi
            echo "$changed" | grep -q '^backend/'  && backend=true  || true
            echo "$changed" | grep -q '^frontend/' && frontend=true || true
            # Compose, proxy or Keycloak config changed without code: redeploy what is running, nothing is built.
            if [ $backend = false ] && [ $frontend = false ]; then
              echo "$changed" | grep -qE '^(docker-compose.*\.yml|infra/|scripts/deploy\.sh)' || run=false
            fi
          else
            action=$IN_ACTION
            case "$IN_SERVICE" in backend) backend=true;; frontend) frontend=true;; *) backend=true; frontend=true;; esac
          fi
          echo "action=$action backend=$backend frontend=$frontend run=$run"
          { echo "action=$action"; echo "backend=$backend"; echo "frontend=$frontend"; echo "run=$run"; } >> "$GITHUB_OUTPUT"

  versions:
    needs: plan
    if: ${{ needs.plan.outputs.action == 'list-versions' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Images in ECR, newest first (the tag is the commit SHA)
        run: |
          for repo in sentrail-api sentrail-web; do
            echo "### $repo" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            aws ecr describe-images --repository-name "$repo" \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:15].[imageTags[0],imagePushedAt]' --output text \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  test:
    needs: plan
    if: ${{ needs.plan.outputs.action == 'deploy' && needs.plan.outputs.run == 'true' && (needs.plan.outputs.backend == 'true' || needs.plan.outputs.frontend == 'true') }}
    uses: ./.github/workflows/ci.yml
    with:
      run_backend: ${{ needs.plan.outputs.backend }}
      run_frontend: ${{ needs.plan.outputs.frontend }}

  build-backend:
    needs: [plan, test]
    if: ${{ needs.test.result == 'success' && needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sentrail-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-frontend:
    needs: [plan, test]
    if: ${{ needs.test.result == 'success' && needs.plan.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (the API's public URL is baked in at build time)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_API_BASE_URL=${{ vars.API_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/sentrail-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [plan, build-backend, build-frontend]
    # After the builds that were needed succeeded, or alone for a rollback or a config-only redeploy.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.action != 'list-versions'
          && needs.build-backend.result != 'failure' && needs.build-frontend.result != 'failure'
          && (needs.plan.outputs.action == 'rollback' || needs.build-backend.result == 'success' || needs.build-frontend.result == 'success'
              || (needs.plan.outputs.backend != 'true' && needs.plan.outputs.frontend != 'true')) }}
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in GitHub -> Settings -> Environments for a manual approval step
    permissions: { contents: read, id-token: write }
    env:
      ACTION: ${{ needs.plan.outputs.action }}
      DO_BACKEND: ${{ needs.plan.outputs.backend }}
      DO_FRONTEND: ${{ needs.plan.outputs.frontend }}
      VERSION: ${{ inputs.version }}
      SEED: ${{ inputs.seed_demo }}
    steps:
      - name: Work out the image tag for each service
        run: |
          set -euo pipefail
          # "" = leave that service as it is; "previous" = roll back one step; otherwise an exact tag. It ends up in a command that runs on the host.
          api=""; web=""
          if [ "$ACTION" = rollback ]; then
            echo "$VERSION" | grep -Eq '^[A-Za-z0-9._-]{0,128}$' || { echo "::error::invalid version"; exit 1; }
            want=${VERSION:-previous}
            [ "$DO_BACKEND"  = true ] && api=$want
            [ "$DO_FRONTEND" = true ] && web=$want
          else
            [ "${{ needs.build-backend.result }}"  = success ] && api=${{ github.sha }}
            [ "${{ needs.build-frontend.result }}" = success ] && web=${{ github.sha }}
          fi
          echo "API_TAG=$api" >> "$GITHUB_ENV"; echo "WEB_TAG=$web" >> "$GITHUB_ENV"
          echo "backend='$api' frontend='$web'"

      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: A rollback target must exist in ECR
        if: ${{ env.ACTION == 'rollback' && inputs.version != '' }}
        run: |
          [ "$DO_BACKEND"  = true ] && aws ecr describe-images --repository-name sentrail-api --image-ids imageTag="$VERSION" >/dev/null
          [ "$DO_FRONTEND" = true ] && aws ecr describe-images --repository-name sentrail-web --image-ids imageTag="$VERSION" >/dev/null
          echo "image $VERSION found"

      - name: Upload deploy bundle (compose files, Caddy/Keycloak/Postgres config, deploy script)
        run: |
          tar czf bundle.tgz docker-compose.yml docker-compose.prod.yml docker-compose.aws.yml infra scripts/deploy.sh
          aws s3 cp bundle.tgz "s3://${{ vars.DEPLOY_BUCKET }}/bundles/${{ github.run_id }}.tgz"

      - name: Deploy on the EC2 host (Systems Manager)
        run: |
          set -euo pipefail
          seed=0; [ "$SEED" = "true" ] && seed=1
          jq -n --arg b "${{ vars.DEPLOY_BUCKET }}" --arg k "${{ github.run_id }}" --arg r "${{ vars.AWS_REGION }}" \
                --arg e "${{ vars.ECR_REGISTRY }}" --arg s "${{ vars.SECRET_ID }}" --arg seed "$seed" \
                --arg api "$API_TAG" --arg web "$WEB_TAG" '{
            executionTimeout: ["1500"],
            commands: [
              "set -e",
              "install -d -m 750 /opt/sentrail",
              ("aws s3 cp s3://" + $b + "/bundles/" + $k + ".tgz /tmp/sentrail-bundle.tgz --region " + $r),
              "tar xzf /tmp/sentrail-bundle.tgz -C /opt/sentrail",
              ("API_TAG=" + $api + " WEB_TAG=" + $web + " ECR_REGISTRY=" + $e + " AWS_REGION=" + $r + " SECRET_ID=" + $s + " SEED_DEMO=" + $seed + " bash /opt/sentrail/scripts/deploy.sh")
            ]}' > params.json
          id=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" --document-name AWS-RunShellScript \
                 --comment "sentrail $ACTION backend=${API_TAG:-keep} frontend=${WEB_TAG:-keep}" --timeout-seconds 120 \
                 --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command $id"
          for i in $(seq 1 200); do      # up to ~25 minutes
            st=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$st" in Pending|InProgress|Delayed) sleep 8;; *) break;; esac
          done
          out=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text | tail -80)
          echo "$out"; { echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$st" = Success ] || { echo "::error::Deploy failed on the host (status $st). Roll back: Run workflow -> rollback."; exit 1; }

      - name: Smoke test from the internet (needs DNS and a certificate)
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null "${{ vars.API_URL }}/readyz"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "${{ vars.APP_URL }}/"
          echo "Done: $ACTION backend=${API_TAG:-unchanged} frontend=${WEB_TAG:-unchanged}"
